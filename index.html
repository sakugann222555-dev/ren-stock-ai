
<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>REN STOCK AI v1.1</title>

<style>

:root{color-scheme:dark;--bg:#0b1020;--panel:#151e30;--line:#29364d;--blue:#548cff;--green:#20d69a;--red:#ff6478}

*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:#edf2ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}

main{max-width:1100px;margin:auto;padding:20px}

header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}

.brand{font-size:23px;font-weight:800;letter-spacing:1px}

.brand span{color:var(--blue)}

small,.muted{color:#91a1ba}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:15px}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.metric{font-size:23px;font-weight:750;margin-top:9px}

h2{font-size:17px;margin:0 0 15px}

button,select,input{background:#202d44;color:white;border:1px solid #394b68;border-radius:9px;padding:12px;font-size:14px}

button{cursor:pointer;background:#315fbd;border:0;font-weight:700}

button:disabled{opacity:.4}

.toolbar{display:flex;gap:10px;flex-wrap:wrap}

.toolbar button{flex:1}

table{width:100%;border-collapse:collapse;min-width:540px}

th,td{text-align:left;padding:13px 9px;border-bottom:1px solid var(--line);font-size:13px}

th{color:#91a1ba}

.green{color:var(--green)}

.red{color:var(--red)}

input,select{width:100%;margin:7px 0}

.sub{font-size:12px;color:#91a1ba;margin-top:9px}

.status{font-size:12px;color:#91a1ba}

#message{margin-top:10px;font-size:13px}

@media(max-width:650px){main{padding:13px}.grid{grid-template-columns:repeat(2,1fr)}.metric{font-size:19px}.brand{font-size:19px}}

</style>

</head>

<body>

<main>

<header>

<div class="brand">◆ REN STOCK <span>AI</span></div>

<div class="status" id="status">接続準備中</div>

</header>

<section class="grid">

<div class="card"><small>運用開始資金</small><div class="metric">$10,000</div></div>

<div class="card"><small>仮想現金残高</small><div class="metric" id="cash">$10,000</div></div>

<div class="card"><small>仮想評価額</small><div class="metric" id="value">$0</div></div>

<div class="card"><small>仮想損益</small><div class="metric" id="pnl">$0</div></div>

</section>

<section class="card">

<h2>市場データ</h2>

<div class="toolbar">

<button id="refresh">株価を更新</button>

</div>

<div id="message">株価を取得してください。</div>

<div style="overflow-x:auto;margin-top:12px">

<table>

<thead><tr><th>銘柄</th><th>株価</th><th>前日比</th><th>騰落率</th></tr></thead>

<tbody id="stocks"></tbody>

</table>

</div>

<div class="sub">Finnhub API / USD表示 / データ取得時点の株価</div>

</section>

<section class="card">

<h2>仮想ポートフォリオ</h2>

<div style="overflow-x:auto">

<table>

<thead><tr><th>銘柄</th><th>保有数</th><th>現在価格</th><th>評価額</th></tr></thead>

<tbody id="holdings"></tbody>

</table>

</div>

</section>

<section class="card">

<h2>仮想売買</h2>

<label>銘柄</label>

<select id="symbol">

<option value="NVDA">NVIDIA (NVDA)</option>

<option value="MSFT">Microsoft (MSFT)</option>

<option value="AAPL">Apple (AAPL)</option>

<option value="MU">Micron (MU)</option>

<option value="PLTR">Palantir (PLTR)</option>

</select>

<label>売買株数</label>

<input id="quantity" type="number" min="0.001" step="0.001" value="1">

<div class="toolbar">

<button id="buy">仮想購入</button>

<button id="sell" style="background:#a83d55">仮想売却</button>

</div>

<div id="tradeMessage" class="sub"></div>

</section>

<section class="card">

<h2>売買履歴</h2>

<div style="overflow-x:auto">

<table>

<thead><tr><th>日時</th><th>銘柄</th><th>売買</th><th>株数</th><th>価格</th></tr></thead>

<tbody id="history"></tbody>

</table>

</div>

</section>

<div class="sub">REN STOCK AI v1.1 / 仮想売買専用 / 投資判断を保証するものではありません。</div>

</main>

<script>

const API="https://ren-stock-api.sakugann222555.workers.dev";

const names={

 NVDA:"NVIDIA",

 MSFT:"Microsoft",

 AAPL:"Apple",

 MU:"Micron",

 PLTR:"Palantir"

};

let prices={};

let cash=10000;

let holdings={};

let history=[];

const $=id=>document.getElementById(id);

const money=n=>"$"+Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

function render(){

 const symbols=Object.keys(names);

 $("stocks").innerHTML=symbols.map(s=>{

  const p=prices[s];

  if(!p)return `<tr><td>${names[s]}</td><td colspan="3">取得待ち</td></tr>`;

  return `<tr>

  <td><b>${names[s]}</b><br><small>${s}</small></td>

  <td>${money(p.price)}</td>

  <td class="${p.change>=0?"green":"red"}">${p.change>=0?"+":""}${money(p.change)}</td>

  <td class="${p.changePercent>=0?"green":"red"}">${p.changePercent>=0?"+":""}${Number(p.changePercent).toFixed(2)}%</td>

  </tr>`;

 }).join("");

 let total=0;

 $("holdings").innerHTML=symbols.map(s=>{

  const h=holdings[s];

  if(!h||h.qty<=0)return "";

  const price=prices[s]?.price||h.avg;

  const v=h.qty*price;

  total+=v;

  return `<tr><td>${names[s]}</td><td>${h.qty.toFixed(3)}</td><td>${money(price)}</td><td>${money(v)}</td></tr>`;

 }).join("")||'<tr><td colspan="4">保有銘柄はありません</td></tr>';

 $("cash").textContent=money(cash);

 $("value").textContent=money(total);

 const profit=total+cash-10000;

 $("pnl").textContent=(profit>=0?"+":"")+money(profit);

 $("pnl").className="metric "+(profit>=0?"green":"red");

 $("history").innerHTML=history.slice().reverse().map(h=>

 `<tr><td>${h.date}</td><td>${h.symbol}</td><td class="${h.type==="購入"?"green":"red"}">${h.type}</td><td>${h.qty}</td><td>${money(h.price)}</td></tr>`

 ).join("")||'<tr><td colspan="5">取引履歴はありません</td></tr>';

}

async function refresh(){

 $("refresh").disabled=true;

 $("status").textContent="株価取得中...";

 $("message").textContent="APIから株価を取得しています...";

 let success=0;

 for(const s of Object.keys(names)){

  try{

   const response=await fetch(`${API}/quote?symbol=${encodeURIComponent(s)}`);

   const data=await response.json();

   if(!response.ok||!Number.isFinite(Number(data.price))||Number(data.price)<=0){

    throw new Error(data.error||"株価取得エラー");

   }

   prices[s]=data;

   success++;

  }catch(e){

   console.error(s,e);

  }

 }

 render();

 $("status").textContent=success===5?"API接続正常":`取得成功 ${success}/5`;

 $("message").textContent=success===5?"全銘柄の株価を取得しました。":`${success}/5銘柄取得。失敗した銘柄は再更新してください。`;

 $("refresh").disabled=false;

}

function trade(type){

 const s=$("symbol").value;

 const qty=Number($("quantity").value);

 const price=prices[s]?.price;

 if(!Number.isFinite(qty)||qty<=0){

  $("tradeMessage").textContent="株数を正しく入力してください。";

  return;

 }

 if(!price){

  $("tradeMessage").textContent="先に株価を取得してください。";

  return;

 }

 const amount=qty*price;

 const h=holdings[s]||{qty:0,avg:0};

 if(type==="購入"){

  if(amount>cash){

   $("tradeMessage").textContent="仮想現金が不足しています。";

   return;

  }

  h.avg=(h.avg*h.qty+amount)/(h.qty+qty);

  h.qty+=qty;

  cash-=amount;

 }else{

  if(qty>h.qty){

   $("tradeMessage").textContent="保有株数が不足しています。";

   return;

  }

  h.qty-=qty;

  cash+=amount;

 }

 holdings[s]=h;

 history.push({

  date:new Date().toLocaleString("ja-JP"),

  symbol:s,type,qty,price

 });

 $("tradeMessage").textContent=`${names[s]}を${qty}株${type}しました。`;

 render();

}

$("refresh").addEventListener("click",refresh);

$("buy").addEventListener("click",()=>trade("購入"));

$("sell").addEventListener("click",()=>trade("売却"));

render();

refresh();

</script>

</body>

</html>
